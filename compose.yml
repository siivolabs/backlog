services:
  backlog-core:
    image: ${BACKLOG_IMAGE:-ghcr.io/siivolabs/backlog:latest}
    container_name: ${CONTAINER_NAME:-backlog-core}
    restart: unless-stopped
    ports:
      - "${BACKLOG_PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      DATA_DIR: /data
      CORE_DATABASE_PATH: /data/backlog-core.sqlite
      LEGACY_DATABASE_PATH: /data/backlog.sqlite
    volumes:
      - ${DATA_PATH:?Set DATA_PATH in .env}:/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
