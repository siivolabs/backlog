services:
  backlog:
    image: ghcr.io/VOTRE_COMPTE/backlog-core:1.0.0
    container_name: backlog-test
    restart: unless-stopped
    ports: ["${BACKLOG_PORT:-3000}:3000"]
    volumes: ["${DATA_PATH:?Définissez DATA_PATH dans .env}:/data"]
    environment:
      CORE_DB_PATH: /data/backlog-core.sqlite
      LEGACY_DB_PATH: /data/backlog.sqlite
      AUTO_IMPORT_LEGACY: "true"
      OLLAMA_BASE_URL: "${OLLAMA_BASE_URL:-http://host.docker.internal:11434}"
      AI_ANALYSIS_MODEL: "${AI_ANALYSIS_MODEL:-qwen3:32b}"
      EMBEDDING_MODEL: "${EMBEDDING_MODEL:-embeddinggemma}"
      AI_TIMEOUT_MS: "${AI_TIMEOUT_MS:-180000}"
      STEAM_FETCH_ENABLED: "${STEAM_FETCH_ENABLED:-true}"
      ADMIN_TOKEN: "${ADMIN_TOKEN:-}"
    extra_hosts: ["host.docker.internal:host-gateway"]
