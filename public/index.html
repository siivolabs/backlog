<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Backlog Core</title><link rel="stylesheet" href="/styles.css"></head>
<body><header><div><p class="eyebrow">BACKLOG CORE <span>V1.1.1</span></p><h1>Redécouvrir ce que vous possédez déjà.</h1></div><nav><button data-view="library" class="active">Bibliothèque & enrichissement</button><button data-view="discovery">Découverte</button></nav></header>
<main>
<section id="library" class="view active">
  <div class="summary">
    <article><span>Bibliothèque</span><strong id="gamesCount">—</strong><small>jeux préservés</small></article>
    <article><span>Profils Core</span><strong id="enrichedCount">—</strong><small id="coverage">—</small></article>
    <article><span>Campagne</span><strong id="campaignStatus">—</strong><small id="campaignDetail">—</small></article>
  </div>
  <div class="progress"><i id="progressBar"></i></div>
  <div class="actions"><button id="start">Démarrer</button><button id="pause" class="secondary">Suspendre</button><button id="resume" class="secondary">Reprendre</button><button id="retry" class="secondary">Relancer les erreurs</button></div>
  <div class="toolbar"><input id="search" placeholder="Rechercher un jeu, un studio ou un genre"><select id="status"><option value="all">Tous</option><option value="enriched">Enrichis</option><option value="pending">À enrichir</option><option value="failed">En erreur</option></select></div>
  <div id="games" class="games"></div><button id="more" class="secondary">Afficher plus</button>
</section>
<section id="discovery" class="view">
  <div class="panel"><p class="eyebrow">INTENTION</p><h2>Que souhaitez-vous vivre maintenant ?</h2><textarea id="motivation" placeholder="Par exemple : explorer librement, ressentir une progression claire, me laisser surprendre sans pression..."></textarea><input id="likedId" inputmode="numeric" placeholder="App ID d’un jeu apprécié (facultatif)"><button id="discover">Chercher des résonances</button></div>
  <div id="recommendations" class="recommendations"></div>
</section>
</main><dialog id="detail"><button id="closeDetail" class="close">×</button><div id="detailBody"></div></dialog>
<div id="toast" role="status"></div><script type="module" src="/app.js"></script></body></html>
