services:
  backlog:
    image: ghcr.io/siivolabs/backlog:dev
    container_name: backlog-test
    user: "1000:1000"
    ports:
      - "127.0.0.1:3087:3000"
    networks:
      - default
      - npm_network
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp
    restart: unless-stopped
    environment:
      PORT: 3000
      DATA_DIR: /data
      DB_PATH: /data/backlog-core.sqlite
      ADMIN_TOKEN: ${ADMIN_TOKEN}
      OLLAMA_URL: ${OLLAMA_URL:-http://192.168.1.77:11434}
      OLLAMA_ANALYSIS_MODEL: ${OLLAMA_ANALYSIS_MODEL:-qwen2.5:7b}
      OLLAMA_EMBEDDING_MODEL: ${OLLAMA_EMBEDDING_MODEL:-nomic-embed-text}
    volumes:
      - ./data:/data
networks:
  npm_network:
    external: true
    name: npm_default
