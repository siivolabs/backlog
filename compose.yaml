services:
  backlog-test:
    image: ghcr.io/siivolabs/backlog:dev
    container_name: backlog-test
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      DB_PATH: /data/backlog.sqlite
      STEAM_API_KEY: ${STEAM_API_KEY:-}
      ADMIN_TOKEN: ${ADMIN_TOKEN:-}
      TWITCH_CLIENT_ID: ${TWITCH_CLIENT_ID:-}
      TWITCH_CLIENT_SECRET: ${TWITCH_CLIENT_SECRET:-}
      STEAM_METADATA_CONCURRENCY: ${STEAM_METADATA_CONCURRENCY:-4}
      STEAM_REQUEST_INTERVAL_MS: ${STEAM_REQUEST_INTERVAL_MS:-150}
      IGDB_BATCH_SIZE: ${IGDB_BATCH_SIZE:-100}
      IGDB_CACHE_TTL_HOURS: ${IGDB_CACHE_TTL_HOURS:-720}
      IGDB_MISS_CACHE_TTL_HOURS: ${IGDB_MISS_CACHE_TTL_HOURS:-24}
      METADATA_LANGUAGE: ${METADATA_LANGUAGE:-french}
      METADATA_COUNTRY: ${METADATA_COUNTRY:-FR}
    volumes:
      - ./data:/data
    networks:
      - npm_default
    read_only: true
    tmpfs:
      - /tmp:size=16m,noexec,nosuid,nodev
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/healthz').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

networks:
  npm_default:
    external: true
