services:
  backlog:
    image: ghcr.io/siivolabs/backlog:dev
    container_name: backlog
    restart: unless-stopped
    user: "1000:1000"
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    environment:
      PORT: 3000
      DATABASE_PATH: /data/backlog-core.sqlite
      ADMIN_TOKEN: ${ADMIN_TOKEN:?ADMIN_TOKEN doit être défini}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      AI_ANALYSIS_MODEL: ${AI_ANALYSIS_MODEL:-qwen3:32b}
      AI_EMBEDDING_MODEL: ${AI_EMBEDDING_MODEL:-embeddinggemma}
      ENRICHMENT_ENABLED: "false"
    volumes:
      - ${DATA_PATH:-./data}:/data
    tmpfs:
      - /tmp:size=64m,noexec,nosuid,nodev
    extra_hosts:
      - host.docker.internal:host-gateway
    networks:
      - npm_default
networks:
  npm_default:
    external: true
