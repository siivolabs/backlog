services:
  backlog-test:
    image: ghcr.io/siivolabs/backlog:dev
    container_name: backlog-test
    restart: unless-stopped
    environment:
      PORT: "3000"
      DATA_DIR: "/data"
      # Laisser vide pour la détection automatique du fichier SQLite existant.
      DATABASE_PATH: "${DATABASE_PATH:-}"
      ADMIN_TOKEN: "${ADMIN_TOKEN:-}"
      OLLAMA_BASE_URL: "${OLLAMA_BASE_URL:-http://192.168.1.77:11434}"
      AI_ANALYSIS_MODEL: "${AI_ANALYSIS_MODEL:-qwen3:32b}"
      AI_EMBEDDING_MODEL: "${AI_EMBEDDING_MODEL:-embeddinggemma}"
      AI_EMBEDDING_DIMENSIONS: "${AI_EMBEDDING_DIMENSIONS:-768}"
      SEARXNG_BASE_URL: "${SEARXNG_BASE_URL:-http://searxng:8080}"
      SEARXNG_LANGUAGE: "${SEARXNG_LANGUAGE:-fr-FR}"
      AI_MAX_WEB_PAGES: "${AI_MAX_WEB_PAGES:-8}"
      AI_MAX_PAGE_BYTES: "${AI_MAX_PAGE_BYTES:-750000}"
      AI_PAGE_TIMEOUT_MS: "${AI_PAGE_TIMEOUT_MS:-15000}"
      AI_DIAGNOSTIC_TIMEOUT_MS: "${AI_DIAGNOSTIC_TIMEOUT_MS:-15000}"
      AI_DIAGNOSTIC_GENERATION_TIMEOUT_MS: "${AI_DIAGNOSTIC_GENERATION_TIMEOUT_MS:-60000}"
    volumes:
      - ./data:/data
    networks:
      - npm_default
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

networks:
  npm_default:
    external: true
