services:
  backlog-similarity-lab:
    build: .
    container_name: backlog-similarity-lab
    restart: unless-stopped
    ports:
      - "3094:3094"
    environment:
      BACKLOG_DB: /data/backlog.sqlite
      OLLAMA_URL: http://192.168.1.77:11434
      EMBEDDING_MODEL: embeddinggemma
      EXPERIMENT_SIZE: 50
      USE_DRAFT_PROFILES: "true"
    volumes:
      # Adaptez uniquement le chemin de gauche si nécessaire.
      - ./data:/data
